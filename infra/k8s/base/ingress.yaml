# ─────────────────────────────────────────────────────────────
# Single public entry point for ShopFlow.
#
# Requires the AWS Load Balancer Controller installed in the
# cluster (see infra/k8s/INGRESS_SETUP.md for the one-time setup).
#
# Routing:
#   /              → frontend (React SPA)
#   /api/users/*   → user-svc      (path prefix /users stripped by rewrite)
#   /api/products/*→ product-svc
#   /api/orders/*  → order-svc
#
# Path rewrite: ALB strips "/api/users" and forwards the rest to
# user-svc's /api/v1/* routes via the rewrite-target annotation.
# ─────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopflow-ingress
  namespace: shopflow
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  rules:
    - http:
        paths:
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: user-svc
                port:
                  number: 8000
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: product-svc
                port:
                  number: 8000
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: order-svc
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
