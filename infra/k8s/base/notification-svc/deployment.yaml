apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-svc
  namespace: shopflow
  labels:
    app: notification-svc
    version: "1.0"
    part-of: shopflow
    managed-by: argocd

spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-svc
  template:
    metadata:
      labels:
        app: notification-svc
        version: "1.0"
        part-of: shopflow
        managed-by: argo-cd

    spec:
      serviceAccountName: notification-sa
      containers:
        - name: notification-svc
          image: 535709431171.dkr.ecr.ap-south-1.amazonaws.com/shopflow/notificationL:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
          - name: AWS_REGION
            value: "ap-south-1"

          # Secret Config
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: notification-svc-secrets
                key: database_url
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: notification-svc-secrets
                key: jwt_secret

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5    # wait 5s after start before first check
            periodSeconds: 10         # check every 10s
            failureThreshold: 3       # fail 3 times before marking unready

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15   # give app more time to fully start
            periodSeconds: 20
            failureThreshold: 3