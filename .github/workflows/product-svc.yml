name: Product Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'services/product/**'        # only trigger on product-svc changes
      - '.github/workflows/product-svc.yml'  # or workflow file itself
  pull_request:
    branches: [main]
    paths:
      - 'services/product/**'

permissions:
  id-token: write  
  contents: write   

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_NAME: shopflow/product

jobs:


  # ── Job 1: Build and Scan ────────────────────────────────
  # Builds image and scans for vulnerabilities before pushing
  build-scan:
    name: Build and Scan Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            services/product/

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'    # pipeline fails if CRITICAL CVE found
          ignore-unfixed: true  # ignore CVEs with no fix available yet


  # Job 2: Push to ECR 
  # Only runs on push to main (not on PRs)
  push:
    name: Push to ECR
    runs-on: ubuntu-latest
    needs: build-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      # Pass image tag to next job without hardcoding
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        run: |
          FULL_IMAGE=$ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }}

          docker build -t $FULL_IMAGE services/product/
          docker push $FULL_IMAGE

          # Also tag as latest for reference (but we deploy by SHA)
          docker tag $FULL_IMAGE $ECR_REGISTRY/$IMAGE_NAME:latest
          docker push $ECR_REGISTRY/$IMAGE_NAME:latest

          echo "Pushed: $FULL_IMAGE"


  # ── Job 3: Update Manifest ───────────────────────────────
  # Updates the image tag in the k8s overlay
  # ArgoCD detects this commit and deploys the new image
  update-manifest:
    name: Update K8s Manifest
    runs-on: ubuntu-latest
    needs: push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update image tag in overlay
        run: |
          cd infra/k8s/overlays/production

          kustomize edit set image \
            $ECR_REGISTRY/$IMAGE_NAME=$ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }}

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@github.com"

          git add infra/k8s/overlays/production/kustomization.yaml
          git commit -m "ci: update product-svc image to ${{ github.sha }} [skip ci]"
          git push
